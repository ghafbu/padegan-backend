services:
  postgres:
    image: postgres:18.1
    container_name: padegan-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
      - POSTGRES_DB=${POSTGRES_DB:-padegan-db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-padegan-db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - padegan-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: padegan-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-password123}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - padegan-network
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    name: padegan-postgres-data
  pgadmin_data:
    name: padegan-pgadmin-data